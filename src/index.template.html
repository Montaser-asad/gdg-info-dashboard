<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDGoC ASU Terminal</title>
<style>
:root{
  --bg:#0b0f19; --bar:#111827; --line:#1f2937; --tx:#e8eaed; --mu:#8b93a7;
  --b:#4285f4; --r:#ea4335; --y:#fbbc04; --g:#34a853; --gl:#5bd987;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);overflow:hidden}
body{display:flex;flex-direction:column;
  font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;
  font-size:clamp(14px,1.25vw,26px);line-height:1.45}
#bar{display:flex;align-items:center;gap:1.2em;padding:.5em 1em;background:var(--bar);border-bottom:1px solid var(--line);color:var(--mu);white-space:nowrap}
#bar .dots span{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.45em}
#bar .grow{flex:1}
#bar b{color:var(--tx)}
#bar a{color:var(--b);cursor:pointer;text-decoration:none}
#out{flex:1;overflow-y:auto;padding:1em 1.4em 0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.line{white-space:pre-wrap;word-break:break-word;min-height:1.45em}
pre.title{margin:.3em 0 .2em;font:inherit;font-size:1.7vw;line-height:1.02;letter-spacing:0;overflow:hidden}
.sh{opacity:.55}
.cb{color:var(--b)}.cr{color:var(--r)}.cy{color:var(--y)}.cg{color:var(--g)}
.mu{color:var(--mu)}.tx{color:var(--tx)}.gl{color:var(--gl)}.ye{color:var(--y)}.re{color:var(--r)}.bl{color:var(--b)}
.cmd{color:var(--y);cursor:pointer;border-bottom:1px dotted transparent}
.cmd:hover{border-bottom-color:var(--y)}
.opt{display:block;padding:.15em .6em;margin:.15em 0;border:1px solid var(--line);border-radius:.4em;cursor:pointer;background:#0e1422}
.opt:hover{border-color:var(--b);background:#111a30}
.opt b{color:var(--y);margin-right:.6em}
.box{border:1px solid var(--line);border-radius:.5em;padding:.6em 1em;margin:.4em 0;background:#0e1422}
.qr{background:#fff;display:inline-block;padding:.5em;border-radius:.4em;line-height:0}
.qr svg{width:min(22vh,22vw);height:auto;display:block}
table.sc{border-collapse:collapse;margin:.2em 0 .8em}
table.sc td{padding:.05em 1.4em .05em 0}
#quick{display:flex;flex-wrap:wrap;gap:.5em;padding:.5em 1.4em;border-top:1px solid var(--line);background:var(--bar)}
#quick button{font:inherit;color:var(--tx);background:#0e1422;border:1px solid var(--line);border-radius:.4em;padding:.25em .8em;cursor:pointer}
#quick button:hover{border-color:var(--y);color:var(--y)}
#prompt{display:flex;align-items:center;gap:.5em;padding:.6em 1.4em;background:var(--bar);border-top:1px solid var(--line)}
#prompt .ps{color:var(--gl);white-space:nowrap}
#prompt .ps i{font-style:normal;color:var(--b)}
#inp{flex:1;font:inherit;color:var(--tx);background:transparent;border:0;outline:0;caret-color:var(--y);min-width:0}
.warn{color:var(--y)}
.line.g{white-space:normal}
.gtitle{font-size:1.7em;font-weight:700;letter-spacing:.06em;color:var(--gl);margin:.1em 0 .2em}
.gtitle.re{color:var(--r)}.gtitle.cg{color:var(--g)}.gtitle.cb{color:var(--b)}.gtitle.cy{color:var(--y)}.gtitle.cr{color:var(--r)}
.scgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:.8em 2.2em;margin-top:.4em}.gtitle.ye{color:var(--y)}
.btn{display:inline-block;padding:.35em 1.3em;border-radius:.4em;background:var(--g);color:#06210f;font-weight:700;cursor:pointer;margin:.6em .9em .4em 0}
.btn:hover{filter:brightness(1.15)}
.hud{display:flex;flex-wrap:wrap;gap:.4em 1.4em;align-items:center}
.chip{padding:.05em .75em;border-radius:1em;font-weight:700;font-size:.85em;border:1px solid}
.d-easy{color:var(--g);border-color:var(--g)}.d-med{color:var(--b);border-color:var(--b)}.d-hard{color:var(--y);border-color:var(--y)}
.d-exp{color:var(--r);border-color:var(--r)}.d-boss{color:#fff;background:var(--r);border-color:var(--r)}
.prog{display:inline-flex;gap:.25em}.seg{width:1.3em;height:.55em;border-radius:.2em;background:var(--line)}.seg.done{background:var(--g)}.seg.now{background:var(--y)}
.tbar{height:.6em;background:var(--line);border-radius:.4em;overflow:hidden;margin:.6em 0 .2em}
.tbar b{display:block;height:100%;width:100%;background:var(--g)}
.qcard{border:1px solid var(--line);border-radius:.7em;padding:.9em 1.2em;background:#0e1422;margin:.6em 0}
.qt{color:var(--gl);font-weight:700;font-size:1.15em;margin-bottom:.3em}
.code{font-size:1.2em;letter-spacing:.05em;color:var(--y);padding:.5em .8em;border-radius:.4em;background:#0a0f1c;border:1px dashed #2a3550;margin:.7em 0;word-break:break-all}
.res{margin-top:.4em;font-size:1.05em;font-weight:700}
.ref{white-space:pre-line;font-size:.78em;line-height:1.7;color:var(--mu);border-left:3px solid var(--line);padding:.2em .8em;margin:.4em 0 .7em;word-spacing:.15em}
.opt b.cg{color:var(--g)}.opt b.cb{color:var(--b)}.opt b.cy{color:var(--y)}.opt b.cr{color:var(--r)}
.ladder{display:flex;flex-wrap:wrap;gap:.5em;margin:.5em 0}
#out.sub{font-size:1.15em}
.qrrow{display:flex;flex-wrap:wrap;gap:2.4em;margin:.6em 0 .4em}
.qrcol{display:flex;flex-direction:column;gap:.35em;align-items:flex-start}
pre.aqr.term{background:transparent;color:#fff;padding:.3em 0;border-radius:0}
pre.aqr{margin:0;padding:.6em;background:#fff;color:#000;border-radius:.4em;font-family:'DejaVu Sans Mono','Cascadia Mono',Consolas,Menlo,monospace;font-size:clamp(9px,2.5vh,20px);line-height:1;letter-spacing:-.1em;white-space:pre;overflow:hidden}
#boot{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;transition:opacity .55s}
#boot.hide{opacity:0;pointer-events:none}
#boot .name{font-weight:700;letter-spacing:.08em;color:var(--tx);font-size:1.25em}
#boot .name span:nth-child(1){color:var(--b)}#boot .name span:nth-child(2){color:var(--r)}#boot .name span:nth-child(3){color:var(--y)}#boot .name span:nth-child(4){color:var(--g)}
.dots4{display:flex;gap:.75em;height:2.4em;align-items:flex-end}
.dots4 i{width:1.1em;height:1.1em;border-radius:50%;display:block;animation:bounce 1s ease-in-out infinite}
.dots4 i:nth-child(1){background:var(--b)}
.dots4 i:nth-child(2){background:var(--r);animation-delay:.14s}
.dots4 i:nth-child(3){background:var(--y);animation-delay:.28s}
.dots4 i:nth-child(4){background:var(--g);animation-delay:.42s}
@keyframes bounce{0%,55%,100%{transform:translateY(0)}28%{transform:translateY(-1.1em)}}
#bootbar{width:min(34em,80vw);height:.4em;background:var(--line);border-radius:.4em;overflow:hidden}
#bootbar b{display:block;height:100%;width:0;border-radius:.4em;background:linear-gradient(90deg,var(--b) 0 25%,var(--r) 25% 50%,var(--y) 50% 75%,var(--g) 75% 100%);transition:width .5s ease-out}
#bootlog{width:min(34em,80vw);min-height:6.2em;color:var(--mu)}
#bootlog .ok{color:var(--g)}
#bootskip{color:var(--mu);font-size:.8em;opacity:.7}
</style>
</head>
<body>
<div id="boot">
  <div class="name"><span>G</span><span>D</span><span>G</span><span>o</span><span>C</span>&nbsp;<span style="color:var(--tx)">ASU</span></div>
  <div class="dots4"><i></i><i></i><i></i><i></i></div>
  <div id="bootbar"><b></b></div>
  <div id="bootlog"></div>
  <div id="bootskip">press any key or tap to skip</div>
</div>
<div id="bar">
  <span class="dots"><span style="background:#ea4335"></span><span style="background:#fbbc04"></span><span style="background:#34a853"></span></span>
  <b id="barname">GDGoC ASU</b><span id="barpath">~/booth</span>
  <span class="grow"></span>
  <span id="clock"></span>
  <a id="fs" title="Toggle fullscreen">[ fullscreen ]</a>
</div>
<div id="out" aria-live="polite"></div>
<div id="quick"></div>
<form id="prompt" autocomplete="off">
  <span class="ps" id="ps"></span>
  <input id="inp" type="text" maxlength="40" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus>
</form>
<noscript>This page needs JavaScript.</noscript>

<!--QR_LIB-->
<script>
"use strict";
/* ============================================================
   EDIT THIS BLOCK: everything the booth needs to show.
   Leave a list empty ([]) and that screen shows a friendly
   "coming soon" message instead of inventing details.
   ============================================================ */
const CONFIG = {
  chapter: "GDGoC ASU",
  full: "Google Developer Groups on Campus",
  school: "Applied Science Private University",
  joinUrl: "https://gdg.community.dev/gdg-on-campus-applied-science-private-university-amman-jordan/",
  socials: [
    { name: "Instagram", handle: "@gdgasu", url: "https://www.instagram.com/gdgasu/" },
    { name: "LinkedIn", handle: "linkedin.com/company/gdgasu", url: "https://www.linkedin.com/company/gdgasu/" },
  ],
  qrStyle: "terminal",   // "terminal" = light blocks on the dark screen (like a real terminal); "panel" = black on a white panel
  idleSeconds: 90,        // go back to the home screen after this much inactivity
};

/* ---------------- helpers ---------------- */
const $ = (s) => document.querySelector(s);
const out = $("#out"), inp = $("#inp"), ps = $("#ps");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let mode = "shell";            // shell | quiz | game | name | confirm
let state = {};
let busy = false;              // ignore input while auto-advancing
let onHome = true;             // true while the home screen is showing
let lastActivity = Date.now();
let runToken = 0;              // cancels stale async flows when we go home

function print(html, cls) {
  const d = document.createElement("div");
  d.className = "line" + (cls ? " " + cls : "");
  d.innerHTML = html;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
  return d;
}
function cmdLink(cmd, label) { return `<span class="cmd" data-cmd="${esc(cmd)}">${label || esc(cmd)}</span>`; }
function setPrompt() {
  const label = { shell: "$", quiz: "answer", game: "answer", name: "name", confirm: "yes/no" }[mode] || "$";
  ps.innerHTML = `guest@gdgoc-asu<i>:~</i>${label === "$" ? "$" : "/" + label + "&gt;"}`;
}
function setPath(p) { $("#barpath").textContent = "~/booth" + (p ? "/" + p : ""); }
function setMode(m) { mode = m; setPrompt(); renderQuick(); }
function renderQuick() {
  out.classList.toggle("sub", mode !== "shell" || !onHome);
  const q = $("#quick");
  if (mode !== "shell") { q.innerHTML = `<button data-cmd="home">⌂ home</button>`; return; }
  q.innerHTML = (onHome ? [] : ["home"]).concat(["about", "join", "socials", "quiz", "game", "scores"])
    .map((c) => `<button data-cmd="${c}">${c === "home" ? "⌂ home" : c}</button>`).join("");
}
function isPlaceholder(u) { return !u || /example\.(com|org)/i.test(u); }

/* ---------------- big title ---------------- */
const GL = {"G": [" ██████╗ ", "██╔════╝ ", "██║  ███╗", "██║   ██║", "╚██████╔╝", " ╚═════╝ "], "D": ["██████╗ ", "██╔══██╗", "██║  ██║", "██║  ██║", "██████╔╝", "╚═════╝ "], "o": ["         ", "         ", " ██████╗ ", "██╔═══██╗", "╚██████╔╝", " ╚═════╝ "], "C": [" ██████╗", "██╔════╝", "██║     ", "██║     ", "╚██████╗", " ╚═════╝"], "A": [" █████╗ ", "██╔══██╗", "███████║", "██╔══██║", "██║  ██║", "╚═╝  ╚═╝"], "S": ["███████╗", "██╔════╝", "███████╗", "╚════██║", "███████║", "╚══════╝"], "U": ["██╗   ██╗", "██║   ██║", "██║   ██║", "██║   ██║", "╚██████╔╝", " ╚═════╝ "]};
function bigTitle() {
  const word = [["G","cb"],["D","cr"],["G","cy"],["o","cg"],["C","cb"],[" ",""],["A","cr"],["S","cy"],["U","cg"]];
  const rows = ["", "", "", "", "", ""];
  word.forEach(([ch, cls], idx) => {
    for (let r = 0; r < 6; r++) {
      if (ch === " ") { rows[r] += "   "; continue; }
      let html = "", run = "", kind = "";
      for (const c of GL[ch][r]) {
        const k = c === "█" ? "m" : c === " " ? "s" : "d";            // m = solid, d = shadow edge, s = space
        if (k !== kind) { if (run) html += kind === "s" ? run : `<span class="${kind === "d" ? cls + " sh" : cls}">${run}</span>`; run = ""; kind = k; }
        run += c;
      }
      if (run) html += kind === "s" ? run : `<span class="${kind === "d" ? cls + " sh" : cls}">${run}</span>`;
      rows[r] += html + (idx < word.length - 1 ? " " : "");
    }
  });
  return `<pre class="title">${rows.join("\n")}</pre>`;
}

/* ---------------- screens ---------------- */
async function home(animate) {
  const my = ++runToken;
  clearRoundTimer();
  out.innerHTML = "";
  state = {};
  onHome = true; setPath("");
  setMode("shell");
  print(bigTitle());
  print(`<span class="mu">${esc(CONFIG.full)}  ·  ${esc(CONFIG.school)}</span>`);
  print("");
  if (animate) {
    const d = print("");
    const msg = "Welcome, student! Type a command or tap a button below.";
    for (let i = 1; i <= msg.length; i++) { if (my !== runToken) return; d.innerHTML = `<span class="gl">${esc(msg.slice(0, i))}</span>`; await sleep(14); }
  } else print(`<span class="gl">Welcome, student! Type a command or tap a button below.</span>`);
  print("");
  const menu = [
    ["1", "about", "what is GDGoC?"],
    ["2", "join", "scan the QR to join us"],
    ["3", "socials", "find us online (QR codes)"],
    ["4", "quiz", "8 questions: tech + cyber"],
    ["5", "game", "4 challenges: cyber, software, AI"],
    ["6", "scores", "leaderboards"],
  ];
  menu.forEach(([n, c, d]) => print(`  <span class="ye">[${n}]</span> ${cmdLink(c, c.padEnd(9))} <span class="mu">${esc(d)}</span>`));
  print("");
  print(`<span class="mu">Tip: type <span class="tx">help</span> any time to see every command.</span>`);
  [...out.children].forEach((e) => e.classList.add("keep"));   // the home block survives `clear`
}

function help() {
  print(`<span class="gl">Commands</span>`);
  [["about", "what GDGoC is"], ["join", "QR code to join"], ["socials", "our social links as QR codes"], ["quiz", "tech + cyber quiz"],
   ["game", "pick a challenge: cyber, software, AI, mixed"], ["scores", "leaderboards"], ["home", "back to the start"], ["clear", "clean the screen"],
   ["fullscreen", "toggle fullscreen"]].forEach(([c, d]) => print(`  ${cmdLink(c, c.padEnd(11))}<span class="mu">${d}</span>`));
}

function about() {
  print(`<span class="gl">About ${esc(CONFIG.chapter)}</span>`);
  print(`<div class="box"><span class="tx">${esc(CONFIG.full)} (GDGoC) is a student-led community for people who want to learn and build with technology.
Think workshops, study jams, talks and projects, run by students at ${esc(CONFIG.school)}.

Curious about coding, cloud, AI, design or security? Ask the team at the booth, we'll point you somewhere to start.</span></div>`);
  if (CONFIG.socials.length) {
    print(`<span class="gl">Find us</span>`);
    CONFIG.socials.forEach((s) => print(`  <span class="ye">${esc(s.name)}</span>  <span class="tx">${esc(s.handle)}</span>`));
    print(`<span class="mu">Type </span>${cmdLink("socials")}<span class="mu"> for QR codes you can scan.</span>`);
  }
}

function join() {
  print(`<span class="gl">Join ${esc(CONFIG.chapter)}</span>`);
  if (isPlaceholder(CONFIG.joinUrl)) {
    print(`<div class="box"><span class="warn">⚠ Organizer: set <b>joinUrl</b> in the CONFIG block of index.html to show the QR code here.</span>\n<span class="mu">For now, just ask the team at the booth!</span></div>`);
    return;
  }
  let lines = [];
  try { lines = asciiQr(CONFIG.joinUrl); } catch (e) { lines = []; }
  print(`<div class="box"><span class="tx">Scan with your phone camera:</span>\n<pre class="aqr ${CONFIG.qrStyle === "panel" ? "" : "term"}" style="display:inline-block;margin:.5em 0;font-size:clamp(8px,1.9vh,17px)">${lines.join("\n")}</pre>\n<span class="mu">${esc(CONFIG.joinUrl)}</span></div>`);
}

/* ---------------- ascii-style QR codes ---------------- */
function qrMatrix(url) {
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const n = q.getModuleCount(), m = 2, N = n + 2 * m;
  return { N, dark: (r, c) => r >= m && c >= m && r < n + m && c < n + m && q.isDark(r - m, c - m) };
}
function asciiQr(url) {                      // two QR rows per text line, using half-block characters
  const { N, dark } = qrMatrix(url), lines = [];
  for (let r = 0; r < N; r += 2) {
    let line = "";
    for (let c = 0; c < N; c++) { const t = dark(r, c), b = dark(r + 1, c); line += t && b ? "█" : t ? "▀" : b ? "▄" : " "; }
    lines.push(line);
  }
  return lines;
}
function socials() {
  print(`<span class="gl">Find us online</span> <span class="mu">scan with your phone camera</span>`);
  const items = CONFIG.socials.filter((x) => x.url);
  if (!items.length) { print(`<div class="box"><span class="mu">No social links set yet.</span></div>`); return; }
  const row = document.createElement("div"); row.className = "qrrow";
  items.forEach((x) => {
    const col = document.createElement("div"); col.className = "qrcol";
    col.innerHTML = `<div class="ye">${esc(x.name)}</div><pre class="aqr ${CONFIG.qrStyle === "panel" ? "" : "term"}">${asciiQr(x.url).join("\n")}</pre><div class="mu">${esc(x.handle)}</div>`;
    row.appendChild(col);
  });
  out.appendChild(row);
}

/* ---------------- scores ---------------- */
const KEY = "gdgoc_asu_scores_v1";
function loadScores() { try { return JSON.parse(localStorage.getItem(KEY)) || { quiz: [], game: [] }; } catch (e) { return { quiz: [], game: [] }; } }
function saveScore(board, name, score) {
  const s = loadScores(); (s[board] = s[board] || []).push({ name, score, t: Date.now() });
  s[board].sort((a, b) => b.score - a.score || a.t - b.t); s[board] = s[board].slice(0, 10);
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  return s[board].findIndex((x) => x.name === name && x.score === score) + 1;
}
function scores() {
  const s = loadScores(), medal = ["ye", "tx", "re"];
  const boards = [["quiz", "Quiz", 80], ["game", "Cyber", GAME_MAX], ["game_sw", "Software", GAME_MAX], ["game_ai", "AI", GAME_MAX], ["game_mix", "Mixed", GAME_MAX]];
  const grid = document.createElement("div"); grid.className = "scgrid";
  boards.forEach(([k, label, max]) => {
    const rows = (s[k] || []).slice(0, 5);
    grid.innerHTML += `<div><div class="gl">${label} top 5 <span class="mu">(of ${max})</span></div>${rows.length ? `<table class="sc">${rows.map((r, i) => `<tr class="${medal[i] || "tx"}"><td>#${i + 1}</td><td>${esc(r.name)}</td><td>${r.score}</td></tr>`).join("")}</table>` : `<div class="mu">No scores yet.</div>`}</div>`;
  });
  out.appendChild(grid);
}

/* ---------------- quiz ---------------- */
const Q = (q, o, a, w) => ({ q, o, a, w });          // o = options, a = index of the correct one, w = why
const QUIZ = [
  /* --- Google and GDG --- */
  Q("What does GDGoC stand for?", ["Google Developer Groups on Campus", "Global Data Group of Computing", "Git Developer Guild of Coders", "Google Design & Games Club"], 0, "Google Developer Groups on Campus: student communities for learning tech."),
  Q("Which language does Google recommend for new Android apps?", ["Perl", "Kotlin", "Ruby", "COBOL"], 1, "Kotlin is Google's preferred language for Android development."),
  Q("Flutter apps are written in which language?", ["Dart", "Swift", "PHP", "Lua"], 0, "Flutter is Google's UI toolkit and it uses Dart."),
  Q("Which Google tool gives you a free cloud notebook for Python and machine learning?", ["Google Colab", "Google Forms", "Google Maps", "Google Keep"], 0, "Colab runs Jupyter-style notebooks in the cloud, with limited free GPU time."),
  Q("Gemini is...", ["A family of Google AI models", "A Google keyboard", "A type of Wi-Fi router", "A programming language"], 0, "Gemini is Google's family of AI models."),
  Q("Firebase is mainly used to...", ["Give apps a ready-made backend (database, login, hosting)", "Print documents", "Edit photos", "Monitor room temperature"], 0, "Firebase provides backend services like auth, databases and hosting."),
  Q("Chrome is built on which open-source project?", ["Chromium", "Linux Mint", "Firefox", "Apache"], 0, "Chrome is built on Chromium, which many other browsers also use."),
  Q("TensorFlow, a popular machine learning library, was created by...", ["Google", "Oracle", "Adobe", "Intel"], 0, "TensorFlow came out of the Google Brain team and was open-sourced in 2015."),
  Q("Which programming language did Google introduce in 2009?", ["Go", "Java", "C#", "Python"], 0, "Go (also called Golang) was released by Google in 2009."),
  /* --- Cybersecurity --- */
  Q("What is 'phishing'?", ["Tricking people with fake messages to steal info", "A type of antivirus", "Fixing broken Wi-Fi", "Compressing files"], 0, "Phishing uses fake emails, links or pages to steal passwords and data."),

const QUIZ_N = 8, SEEN_KEY = "gdgoc_asu_seen_q_v1";
function pickQuiz() {
  let seen = []; try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) {}
  let fresh = QUIZ.map((_, i) => i).filter((i) => !seen.includes(i));
  if (fresh.length < QUIZ_N) { seen = []; fresh = QUIZ.map((_, i) => i); }      // everything used: start a new cycle
  const chosen = shuffle(fresh).slice(0, QUIZ_N);
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen.concat(chosen))); } catch (e) {}
  return chosen.map((i) => {                  // shuffle the answer order too
    const it = QUIZ[i], correct = it.o[it.a], o = shuffle(it.o);
    return { q: it.q, o, a: o.indexOf(correct), w: it.w };
  });
}
function startQuiz() {
  state.quiz = { list: pickQuiz(), i: 0, score: 0 };
  setMode("quiz"); setPath("quiz"); out.innerHTML = "";
  print(`<span class="gl">GDGoC Quiz</span> <span class="mu">${QUIZ_N} questions, 10 points each. Type a, b, c or d (or tap an answer). Type quit to leave.</span>`);
  print(""); askQuiz();
}
function askQuiz() {
  const z = state.quiz, item = z.list[z.i], L = ["a", "b", "c", "d"];
  print(`<span class="ye">Q${z.i + 1}/${z.list.length}</span>  <span class="tx">${esc(item.q)}</span>`);
  item.o.forEach((t, k) => print(`<span class="opt" data-ans="${L[k]}"><b>${L[k]})</b>${esc(t)}</span>`));
  busy = false;
}
async function answerQuiz(txt) {
  const z = state.quiz, item = z.list[z.i], L = ["a", "b", "c", "d"];
  let k = L.indexOf(txt); if (k < 0 && /^[1-4]$/.test(txt)) k = Number(txt) - 1;
  if (k < 0) { print(`<span class="warn">Type a, b, c or d.</span>`); return; }
  busy = true; const my = runToken;
  if (k === item.a) { z.score += 10; print(`<span class="gl">✓ Correct!</span> <span class="mu">${esc(item.w)}</span>`); }
  else print(`<span class="re">✗ Not quite.</span> <span class="tx">Answer: ${L[item.a]}) ${esc(item.o[item.a])}</span> <span class="mu">${esc(item.w)}</span>`);
  print(""); await sleep(1400); if (my !== runToken) return;
  z.i++;
  if (z.i < z.list.length) askQuiz(); else finish("quiz", z.score, z.list.length * 10);
}

const BOARD_LABEL = { quiz: "Quiz", game: "Cyber", game_sw: "Software", game_ai: "AI", game_mix: "Mixed" };
let roundTimer = null;
const clearRoundTimer = () => { clearInterval(roundTimer); roundTimer = null; };
const hearts = (n) => "♥".repeat(Math.max(0, n)) + "♡".repeat(Math.max(0, LIVES - n));
const DIFF = (l) => l <= 2 ? ["EASY", "d-easy"] : l <= 4 ? ["MEDIUM", "d-med"] : l <= 6 ? ["HARD", "d-hard"] : l === 7 ? ["EXPERT", "d-exp"] : ["BOSS", "d-boss"];
const segs = (cur, n) => Array.from({ length: n }, (_, k) => `<span class="seg ${k < cur ? "done" : k === cur ? "now" : ""}"></span>`).join("");
function startGame() {
  setMode("game"); setPath("game"); clearRoundTimer(); out.innerHTML = "";
  state.game = { stage: "pick", track: "cyber", board: "game", i: 0, score: 0, lives: LIVES, hintUsed: false, t0: 0, rounds: [] };
  print(`<div class="gtitle">CHOOSE YOUR CHALLENGE</div>`, "g");
  print(`<div class="mu">Each challenge has 8 levels that get harder. Tap one or type its number.</div>`, "g");
  [["1", "cyber"], ["2", "software"], ["3", "ai"], ["4", "mixed"]].forEach(([n, k]) => { const T = TRACKS[k]; print(`<span class="opt" data-ans="${n}"><b class="${T.col}">${n}) ${T.name}</b>${esc(T.desc)}</span>`, "g"); });
  print(`<div class="mu">Type quit to leave.</div>`, "g");
}
function chooseTrack(k) {
  const g = state.game, T = TRACKS[k]; g.track = k; g.board = T.board; g.stage = "intro"; out.innerHTML = "";
  print(`<div class="gtitle ${T.col}">${T.title}</div>`, "g");
  print(`<div class="mu">8 levels, and they get harder. Can you clear them all?</div>`, "g");
  print(`<div class="qcard"><div class="qt">HOW TO PLAY</div><div class="tx">You have <span class="re">${hearts(LIVES)}</span> 3 lives. A wrong answer, or running out of time, costs one.<br>Answer faster for bonus points. <span class="ye">hint</span> gives a clue but costs 5 points.<br>Type your answer and press Enter, or tap an option. <span class="ye">quit</span> leaves the game.</div></div>`, "g");
  print(`<div class="ladder">${Array.from({ length: 8 }, (_, i) => { const [n, c] = DIFF(i + 1); return `<span class="chip ${c}">${i + 1} ${n}</span>`; }).join("")}</div>`, "g");
  print(`<span class="btn" data-ans="start">▶ START</span><span class="mu">or type start</span>`, "g");
}
function hud(g, r) {
  const [dn, dc] = DIFF(r.lvl);
  return `<div class="hud"><span class="ye">LEVEL ${r.lvl}/${g.rounds.length}</span><span class="chip ${dc}">${dn}</span><span class="prog">${segs(g.i, g.rounds.length)}</span><span class="re">${hearts(g.lives)}</span><span class="gl">SCORE ${g.score}</span><span class="mu">worth ${r.pts}</span></div>`;
}
function askRound() {
  const g = state.game, r = g.rounds[g.i], my = runToken, idx = g.i;
  g.stage = "round"; g.hintUsed = false; g.t0 = Date.now(); busy = false;
  out.innerHTML = "";
  print(hud(g, r) + `<div class="tbar"><b id="tb"></b></div><div class="mu"><span id="tsec">${r.limit}</span>s left  ·  type <span class="ye">hint</span> for a clue (-5)</div>`, "g");
  let card = `<div class="qcard"><div class="qt">${esc(r.t)}</div><div class="tx">${esc(r.d)}</div>`;
  if (r.c) card += `<div class="code">${esc(r.c)}</div>`;
  if (r.ref) card += `<div class="ref">${esc(r.ref)}</div>`;
  if (r.type === "choice") card += r.o.map((t, k) => `<span class="opt" data-ans="${k + 1}"><b>${k + 1})</b>${esc(t)}</span>`).join("");
  print(card + `</div>`, "g");
  clearRoundTimer(); roundTimer = setInterval(() => tick(my, idx, r.limit), 100);
}
function tick(my, idx, limit) {
  const g = state.game;
  if (my !== runToken || !g || mode !== "game") { clearRoundTimer(); return; }
  if (g.i !== idx || busy) return;
  const left = Math.max(0, limit - (Date.now() - g.t0) / 1000), pct = left / limit * 100;
  const tb = $("#tb"), ts = $("#tsec"); if (!tb || !ts) return;
  tb.style.width = pct + "%"; tb.style.background = pct > 50 ? "var(--g)" : pct > 25 ? "var(--y)" : "var(--r)"; ts.textContent = Math.ceil(left);
  if (left <= 0) { clearRoundTimer(); timeUp(my, idx); }
}
async function timeUp(my, idx) {
  const g = state.game; if (my !== runToken || !g || g.i !== idx || busy || mode !== "game") return;
  busy = true; g.lives--;
  print(`<div class="res re">TIME'S UP!  Answer: ${esc(g.rounds[idx].show)}   ${hearts(g.lives)}</div>`, "g");
  await afterRound(my);
}
async function answerGame(txt) {
  const g = state.game;
  if (g.stage === "pick") {
    const m = { "1": "cyber", cyber: "cyber", "2": "software", software: "software", "3": "ai", ai: "ai", "4": "mixed", mixed: "mixed" }[txt];
    if (m) chooseTrack(m); else print(`<span class="warn">Type 1, 2, 3 or 4 (or quit).</span>`); return;
  }
  if (g.stage === "intro") { if (txt === "start") { g.rounds = buildRounds(g.track); askRound(); } else print(`<span class="warn">Type start to begin, or quit to leave.</span>`); return; }
  const r = g.rounds[g.i];
  if (txt === "hint") { if (g.hintUsed) print(`<div class="mu">You already used the hint for this level.</div>`, "g"); else { g.hintUsed = true; print(`<div class="mu">Hint (-5 pts): ${esc(r.hint)}</div>`, "g"); } return; }
  clearRoundTimer(); busy = true; const my = runToken;
  const secs = (Date.now() - g.t0) / 1000;
  if (r.a.includes(norm(txt))) {
    const ratio = secs / r.limit, bonus = ratio <= 1 / 3 ? 5 : ratio <= 2 / 3 ? 3 : 0;
    const gain = Math.max(0, r.pts + bonus - (g.hintUsed ? 5 : 0)); g.score += gain;
    print(`<div class="res gl">✓ Correct!  +${gain} points  (${secs.toFixed(1)}s)</div>`, "g");
  } else { g.lives--; print(`<div class="res re">✗ Not this time.  Answer: ${esc(r.show)}   ${hearts(g.lives)}</div>`, "g"); }
  await afterRound(my);
}
async function afterRound(my) {
  const g = state.game; await sleep(1600); if (my !== runToken) return;
  if (g.lives <= 0) {
    out.innerHTML = "";
    print(`<div class="qcard"><div class="gtitle re">GAME OVER</div><div class="tx">${TRACKS[g.track].name} challenge: you reached level ${g.i + 1} of ${g.rounds.length}.</div></div>`, "g");
    return finish(g.board, g.score, GAME_MAX);
  }
  g.i++;
  if (g.i < g.rounds.length) return askRound();
  g.score += ALL_CLEAR_BONUS; out.innerHTML = "";
  print(`<div class="qcard"><div class="gtitle ye">★ ALL ${g.rounds.length} LEVELS CLEARED</div><div class="tx">+${ALL_CLEAR_BONUS} bonus points</div></div>`, "g");
  finish(g.board, g.score, GAME_MAX);
}

/* ---------------- finish / name entry ---------------- */
function finish(board, score, max) {
  const verdict = score >= max * 0.9 ? "Legendary!" : score >= max * 0.65 ? "Nice work!" : score >= max * 0.4 ? "Good start!" : "Thanks for playing, try again!";
  print(""); print(`<span class="ye">Final score: ${score} / ${max}</span>  <span class="gl">${verdict}</span>`);
  print(`<span class="tx">Enter your name for the leaderboard (or press Enter to skip):</span>`);
  state.pending = { board, score }; setMode("name"); busy = false;
}
async function saveName(txt) {
  const p = state.pending, name = (txt || "").trim().slice(0, 16) || "Anonymous";
  const rank = saveScore(p.board, name, p.score);
  print(`<span class="gl">Saved! You are #${rank} on the ${BOARD_LABEL[p.board] || "challenge"} board.</span>`); print("");
  scores(); onHome = false; setPath("scores"); setMode("shell");
  print(`<span class="mu">Type </span>${cmdLink("home")}<span class="mu"> to go back to the start.</span>`);
}

/* ---------------- command router ---------------- */
async function run(raw) {
  const txt = raw.trim(); lastActivity = Date.now();
  if (mode === "name") { print(`<span class="mu">name&gt;</span> ${esc(txt)}`); return saveName(txt); }
  if (txt) print(`<span class="gl">${esc(ps.textContent)}</span> ${esc(txt)}`);
  const c = txt.toLowerCase();
  if (mode === "confirm") { if (c === "yes" || c === "y") { try { localStorage.removeItem(KEY); } catch (e) {} print(`<span class="gl">Leaderboards cleared.</span>`); } else print(`<span class="mu">Cancelled.</span>`); setMode("shell"); return; }
  if (mode === "quiz" || mode === "game") {
    if (c === "quit" || c === "exit" || c === "home") return home(false);
    if (busy) return;
    return mode === "quiz" ? answerQuiz(c) : answerGame(c);
  }
  const view = (fn) => {
    out.innerHTML = ""; onHome = false; setPath(fn.name); renderQuick(); fn(); print("");
    print(`<span class="mu">Type </span>${cmdLink("home")}<span class="mu"> or tap the home button to go back.</span>`);
    out.scrollTop = 0;
  };
  const map = { "1": "about", "2": "join", "3": "socials", "4": "quiz", "5": "game", "6": "scores" };
  const cmd = map[c] || c;
  switch (cmd) {
    case "": return;
    case "help": case "?": case "menu": return view(help);
    case "home": case "start": return home(false);
    case "about": return view(about);
    case "join": return view(join);
    case "socials": case "social": return view(socials);
    case "quiz": return startQuiz();
    case "game": case "challenge": return startGame();
    case "scores": case "leaderboard": return view(scores);
    case "clear": case "cls": [...out.children].forEach((e) => { if (!e.classList.contains("keep")) e.remove(); }); if (!out.children.length) return home(false); out.scrollTop = 0; return;
    case "fullscreen": case "fs": return toggleFs();
    case "reset-scores": print(`<span class="warn">This erases ALL leaderboard scores. Type yes to confirm.</span>`); return setMode("confirm");
    default: print(`<span class="re">command not found:</span> <span class="tx">${esc(txt)}</span> <span class="mu">(try </span>${cmdLink("help")}<span class="mu">)</span>`);
  }
}
function toggleFs() { if (!document.fullscreenElement) (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement); else document.exitFullscreen(); }

/* ---------------- tab completion ---------------- */
let lastTab = "";
function autocomplete() {
  const pool = mode === "shell" ? ["about", "join", "socials", "quiz", "game", "scores", "help", "home", "clear", "fullscreen"]
    : mode === "game" ? ["start", "hint", "quit"] : mode === "quiz" ? ["quit"] : [];
  const v = inp.value.toLowerCase(); if (!pool.length) return;
  const m = pool.filter((c) => c.startsWith(v));
  if (!m.length) return;
  if (m.length === 1) { inp.value = m[0]; return; }
  let pre = m[0]; for (const c of m) while (!c.startsWith(pre)) pre = pre.slice(0, -1);
  if (pre.length > v.length) { inp.value = pre; return; }
  if (lastTab === v) print(`<span class="mu">${m.map(esc).join("   ")}</span>`);
  lastTab = v; setTimeout(() => { if (inp.value.toLowerCase() !== v) lastTab = ""; }, 0);
}
/* ---------------- events wiring ---------------- */
$("#prompt").addEventListener("submit", (e) => { e.preventDefault(); const v = inp.value; inp.value = ""; run(v); });
document.addEventListener("click", (e) => {
  lastActivity = Date.now();
  const t = e.target.closest("[data-cmd],[data-ans],#fs");
  if (t) {
    if (t.id === "fs") toggleFs();
    else if (t.dataset.cmd) { if (mode === "name") { if (t.dataset.cmd === "home") home(false); return; } run(t.dataset.cmd); }
    else if (t.dataset.ans && !busy) run(t.dataset.ans);
  }
  inp.focus();
});
document.addEventListener("keydown", (e) => {
  lastActivity = Date.now();
  if (e.key === "Tab") { e.preventDefault(); inp.focus(); autocomplete(); return; }
  if (document.activeElement !== inp) inp.focus();
});
setInterval(() => {
  const d = new Date(); $("#clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (Date.now() - lastActivity > CONFIG.idleSeconds * 1000 && (mode !== "shell" || out.children.length > 14)) { lastActivity = Date.now(); home(true); }
}, 1000);

/* ---------------- boot animation ---------------- */
async function bootSequence() {
  const el = $("#boot"); if (!el) return;
  let skipped = false; const skip = () => { skipped = true; };
  document.addEventListener("keydown", skip, { once: true }); el.addEventListener("click", skip, { once: true });
  const log = $("#bootlog"), bar = $("#bootbar b");
  const steps = ["Starting GDGoC ASU terminal", "Loading the quiz", "Loading the challenges", "Connecting the booth"];
  for (let i = 0; i < steps.length && !skipped; i++) {
    const d = document.createElement("div"); d.innerHTML = `<span class="mu">&gt; ${esc(steps[i])}...</span>`; log.appendChild(d);
    bar.style.width = ((i + 1) / steps.length * 92) + "%";
    await sleep(560);
    d.innerHTML = `<span class="mu">&gt; ${esc(steps[i])}...</span> <span class="ok">ok</span>`;
  }
  bar.style.width = "100%";
  if (!skipped) await sleep(380);
  el.classList.add("hide"); await sleep(560); el.remove();
}

function selftest() {
  let bad = 0, n = 0;
  const un = (c) => c.split(" ").map((x) => String.fromCharCode(parseInt(x, 2))).join("");
  const unh = (c) => c.split(" ").map((x) => String.fromCharCode(parseInt(x, 16))).join("");
  for (let t = 0; t < 400; t++) {
    const R = buildRounds();
    R.forEach((r) => {
      n++; let dec = null;
      if (r.lvl === 2) dec = un(r.c);
      else if (r.lvl === 3) dec = caesar(r.c.toLowerCase(), -Number(r.d.match(/by (\d+)/)[1]));
      else if (r.lvl === 5) dec = unh(r.c);
      else if (r.lvl === 7) dec = caesar(r.c.toLowerCase(), -13);
      if (dec !== null && !r.a.includes(norm(dec))) { bad++; print(`<span class="re">BAD L${r.lvl}: ${esc(r.c)} -> ${esc(dec)} vs ${esc(r.a)}</span>`); }
      if (r.type === "choice" && r.o[Number(r.a[0]) - 1] !== r.show) { bad++; print(`<span class="re">BAD choice L${r.lvl}</span>`); }
    });
  }
  const indep = (m, r) => {
    switch (m.k) {
      case "len": return String(m.w.length);
      case "bin": return String(parseInt(m.bin, 2));
      case "range": { let last; for (let i = 0; i < m.n; i++) last = i; return String(last); }
      case "mod": return String(m.a - m.b * Math.floor(m.a / m.b));
      case "fb": { let o = ""; if (m.n % 3 === 0) o += "Fizz"; if (m.n % 5 === 0) o += "Buzz"; return o || String(m.n); }
      case "stack": { const st = []; m.arr.forEach((x) => st.push(x)); for (let i = 0; i < m.pops; i++) st.pop(); return String(st[st.length - 1]); }
      case "fib": { let a = 1, b = 1; for (let i = 2; i <= m.N; i++) [a, b] = [b, a + b]; return String(b); }
      case "fact": { let f = 1; for (let i = 2; i <= m.N; i++) f *= i; return String(f); }
      case "seq": { const t = m.terms, d = t[1] - t[0]; return String(t[2] - t[1] === d ? t[3] + d : t[3] * (t[1] / t[0])); }
      case "prec": return String(m.t * 100 / m.f);
      case "neuron": return String(Math.max(0, m.w1 * m.x1 + m.w2 * m.x2 + m.b));
    }
    return null;
  };
  ["cyber", "software", "ai", "mixed"].forEach((tr) => {
    for (let t = 0; t < 300; t++) {
      const RR = buildRounds(tr);
      if (RR.length !== 8 || RR.some((r, i) => r.lvl !== i + 1)) { bad++; print(`<span class="re">BAD ${tr}: level order</span>`); break; }
      RR.forEach((r) => {
        n++;
        if (r.m) { const v = indep(r.m); if (v !== null && !r.a.includes(norm(v))) { bad++; print(`<span class="re">BAD ${tr} L${r.lvl}: ${esc(v)} vs ${esc(r.a)}</span>`); } }
        if (r.type === "choice" && r.o[Number(r.a[0]) - 1] !== r.show) { bad++; print(`<span class="re">BAD ${tr} choice L${r.lvl}</span>`); }
        if (r.type === "choice" && new Set(r.o).size !== r.o.length) { bad++; print(`<span class="re">BAD ${tr} dup options L${r.lvl}</span>`); }
        if (r.limit < 45) { bad++; print(`<span class="re">BAD ${tr} L${r.lvl}: timer ${r.limit}s too short</span>`); }
      });
    }
  });
  const qs = new Set();
  QUIZ.forEach((it, i) => {
    if (it.o.length !== 4 || new Set(it.o).size !== 4 || !(it.a >= 0 && it.a < 4) || !it.w || qs.has(it.q)) { bad++; print(`<span class="re">BAD quiz question #${i}: ${esc(it.q)}</span>`); }
    qs.add(it.q);
  });
  for (let t = 0; t < 200; t++) { const L = pickQuiz(); if (L.length !== QUIZ_N || new Set(L.map((x) => x.q)).size !== QUIZ_N || L.some((x) => x.o[x.a] === undefined)) { bad++; print(`<span class="re">BAD pickQuiz</span>`); break; } }
  try { localStorage.removeItem(SEEN_KEY); } catch (e) {}
  print(`<span class="mu">quiz bank: ${QUIZ.length} questions, ${QUIZ_N} per game</span>`);
  CONFIG.socials.concat([{ url: CONFIG.joinUrl }]).filter((x) => x.url).forEach((x) => {
    const { N, dark } = qrMatrix(x.url), L = asciiQr(x.url); let wrong = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const ch = L[r >> 1][c], top = ch === "█" || ch === "▀", bot = ch === "█" || ch === "▄";
      if ((r % 2 === 0 ? top : bot) !== dark(r, c)) wrong++;
    }
    if (wrong) { bad++; print(`<span class="re">BAD ascii QR for ${esc(x.url)}: ${wrong} cells</span>`); }
  });
  print(bad ? `<span class="re">selftest FAILED: ${bad}</span>` : `<span class="gl">selftest ok: ${n} rounds verified</span>`);
}
/* demo mode: open index.html#demo to play a scripted tour (used to record the README demo) */
async function runDemo() {
  const type = async (t) => { for (const ch of t) { inp.value += ch; await sleep(110); } await sleep(220); $("#prompt").dispatchEvent(new Event("submit", { cancelable: true })); };
  await sleep(1500); await type("about"); await sleep(1900);
  await type("join"); await sleep(2000);
  await type("socials"); await sleep(2000);
  await type("home"); await sleep(1100);
  await type("quiz");
  for (let k = 0; k < 2; k++) { await sleep(1100); const z = state.quiz; await type("abcd"[z.list[z.i].a]); await sleep(1700); }
  await sleep(400); await type("home"); await sleep(1000);
  await type("game"); await sleep(1100); await type("1"); await sleep(1500); await type("start");
  for (let k = 0; k < 2; k++) { await sleep(1300); const g = state.game; await type(g.rounds[g.i].a[0]); await sleep(1900); }
  await sleep(800); await type("home"); await sleep(1800);
}
/* test hook: index.html#test=quiz|a|b  runs commands in order */
async function boot() {
  $("#barname").textContent = CONFIG.chapter;
  if (/test=/.test(location.hash)) $("#boot") && $("#boot").remove(); else await bootSequence();
  document.title = CONFIG.chapter + " Terminal";
  await home(!/test=/.test(location.hash));
  const j = location.hash.match(/joinUrl=([^&]*)/); if (j && /debug/.test(location.hash)) CONFIG.joinUrl = decodeURIComponent(j[1]);
  const m = location.hash.match(/test=([^&]*)/);
  if (m) for (const c of decodeURIComponent(m[1]).split("|")) {
    await sleep(60);
    if (c === "selftest") { selftest(); continue; }
    if (c.startsWith("@lvl ")) { const g = state.game; if (g && g.rounds.length) { g.i = Number(c.slice(5)) - 1; askRound(); } continue; }
    if (c.startsWith("@tab ")) { inp.value = c.slice(5); autocomplete(); print(`<span class="gl">tab -> "${esc(inp.value)}"</span>`); continue; }
    await run(c); await sleep(1500);
  }
  inp.focus();
  if (/#demo/.test(location.hash)) runDemo();
}
if (/debug/.test(location.hash)) window.onerror = (m, s, l) => print(`<span class="re">JS error: ${esc(m)} @${l}</span>`);
boot();
</script>
